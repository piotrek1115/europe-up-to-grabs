  <div style="font-size:12.5px;line-height:1.5">
  <p><b>Cel:</b> najwięcej <b>Chwały</b> po 8 rundach (albo gdy znikną neutralne ziemie). Masz <b>3 Akcje</b> na turę.</p>
  <p><b>Armia:</b> kliknij swoją Armię → kliknij sąsiednią prowincję. Zielona = marsz (po swoim), czerwona = atak, 🔒 = za mocna na gołą Armię (przygotuj ją Dowódcą/Wzmocnieniem).</p>
  <p><b>Bramkowanie ataku:</b> Obrona ≤3 dowolna Armia; 4–5 wymaga Przygotowanej (Dowódca lub Wzmocnienie); ≥6 wymaga Dowódcy albo 2 Wzmocnień.</p>
  <p><b>Karty z ręki:</b> Dowódca/Wzmocnienie/Postać → kliknij kartę, potem swoją Armię (dołączasz). Intrygi i Karty Specjalne → kliknij, wybierz cel/efekt. <b>Taktyki i Reakcje</b> kładziesz zakryte dopiero <b>w bitwie</b>.</p>
  <p><b>Bitwa (blef!):</b> obie strony kładą do 2 kart zakrytych (możesz blefować śmieciami). Przed odkryciem: atakujący może się wycofać, obrońca zaproponować okup. Zagrane karty przepadają — też blefy.</p>
  <p><b>Rekrutacja:</b> dwuklik na swojej ziemi (5 Złota, Galowie 4). Limit 3 Armie (Galowie 4).</p>
  <p><b>Dwór (👑):</b> kliknij swoją matę — mianuj Postać Władcą, poprowadź nim Armię (ryzyko śmierci → Bezkrólewie).</p>
  <p><b>Wrogowie:</b> panel w prawym-dolnym rogu — kliknij frakcję, by zobaczyć jej stan i prowadzić dyplomację.</p>
  <p><b>Wydarzenia:</b> karty Chaosu są wtasowane w talie i odpalają się, gdy ktoś je dobierze (patrz Kronika stołu).</p>
  <p style="text-align:center;margin-top:10px"><button class="btn" id="closeHelp">Zamknij</button></p>
  </div>`, el=>{ el.querySelector("#closeHelp").onclick=closeMsg; }); }
async function endTurn(){
  // goths streak reset if no conquest this turn
  if(S.order[S.cur]==="goths" && !S.f.goths.conqThisTurn) S.f.goths.streak=0;
  await advance();
}
async function advance(){
  clearSel(); busy=true; render();
  let guard=0;
  do{
    S.cur++;
    if(S.cur>=S.order.length){ S.cur=0; await endRound(); if(S.over){busy=false;render();return;} }
    guard++;
  }while(!S.f[S.order[S.cur]].alive && guard<12);
  const fk=S.order[S.cur];
  S.actions=3; S.f[fk].conqThisTurn=false;
  rulerUpkeep(fk);
  // Dochód na starcie tury: +1 Złoto/Prowincję, +1 Chwały/pełny Region; dobór karty
  if(S.f[fk].alive){ const pc=provCount(fk), rg=fullRegions(fk); if(pc>0)S.f[fk].gold+=pc; if(rg>0)S.f[fk].glory+=rg; draw(fk);
    if(fk===S.player) talkSys(`💰 Dochód: +${pc} Złota${rg?`, +${rg} Chwały za regiony`:""}, dobrano kartę.`); }
  render();
  if(fk===S.player){ busy=false; render(); toast(`Twoja tura — Runda ${S.round}. Masz 3 akcje.`); }
  else { await aiTurn(fk); await sleep(300); await advance(); }
}
async function endRound(){
  // reset moved
  S.armies.forEach(a=>{a.moved=false;});
  // blokada ruchu (zmęczenie po przegranej / „ukradziona mapa") wygasa z końcem rundy
  S.armies.forEach(a=>{a.blocked=false;});
  // faction upkeep — odrębne silniki Chwały
  // GALOWIE: Chwała za każdą Armię ponad pierwszą (konfederacja wodzów)
  if(S.f.gauls.alive){ let extra=Math.max(0,armiesOf("gauls").length-1); if(extra>0){ S.f.gauls.glory+=extra; talkSys(`⚜️ Konfederacja Galów: +${extra} Chwały za ${extra+1} wodzów.`);} }
  // RZYM: Dekadencja + Chwała za przetrwanie i stabilność
  if(S.f.rome.alive){ let over=Math.max(0,provCount("rome")-3); S.f.rome.dek+=over;
    if(provCount("rome")>0 && S.prov.italia.owner==="rome") S.f.rome.glory+=2;
    if(S.f.rome.dek<=2 && provCount("rome")>0){ S.f.rome.glory+=1; talkSys(`🏛️ Rzym trzyma się w ryzach (Dekadencja ${S.f.rome.dek}): +1 Chwały za stabilność.`); }
    if(S.f.rome.dek>=4){ let ps=Object.keys(PROV).filter(p=>S.prov[p].owner==="rome"&&!armyAt(p)); if(ps.length){ let p=ps[seedInt()%ps.length]; S.prov[p].owner=null; talkSys(`🏛️ DEKADENCJA! ${PROV[p].name} buntuje się przeciw Rzymowi.`);} S.f.rome.dek-=4; } }
  // eliminate factions with no provinces & no armies
  alive().forEach(k=>{ if(provCount(k)===0 && armiesOf(k).length===0){ S.f[k].alive=false; talkSys(`☠️ ${FACTIONS[k].short} znika z mapy dziejów.`);} });
  // (dobór kart przeniesiony na start tury każdego gracza)
  S.round++; S.noRecruit=false;
  const neutrals=Object.keys(PROV).filter(p=>!S.prov[p].owner).length;
  if(S.round>S.maxRounds || neutrals===0){ endGame(); return; }
  talkSys(`— RUNDA ${S.round} —`);
  render();
  await sleep(400);
}
function endGame(){
  S.over=true;
  // region bonus
  for(const r in REGIONS){ const provs=REGIONS[r].provs; let owner=S.prov[provs[0]].owner;
    if(owner && provs.every(p=>S.prov[p].owner===owner)){ S.f[owner].glory+=3; talkSys(`👑 ${FACTIONS[owner].short} kontroluje cały region ${REGIONS[r].name}: +3 Chwały.`); } }
  const rank=Object.keys(FACTIONS).sort((a,b)=>(S.f[b].glory-S.f[a].glory)||(provCount(b)-provCount(a))||(S.f[b].gold-S.f[a].gold));
  const win=rank[0];
  render();
  showMsg(`<h2>Koniec dziejów</h2>
    <p><b style="font-size:20px">${FACTIONS[win].short}</b> zwycięża z ${S.f[win].glory} Chwały!</p>
    <div class="opts">${rank.map((k,i)=>`<div class="opt" style="cursor:default"><b>${i+1}. ${FACTIONS[k].short}</b> — ${S.f[k].glory} Chwały • ${provCount(k)} prowincji ${k===S.player?"(Ty)":""}</div>`).join("")}</div>
    <p style="margin-top:12px;text-align:center"><button class="btn" onclick="location.reload()">Zagraj ponownie</button></p>`,()=>{},true);
}

/* ===================== LLM ===================== */
let API_KEY=localStorage.getItem("barb_key")||"", MODEL=localStorage.getItem("barb_model")||"claude-sonnet-5";
async function callLLM(sys,usr){
  if(!API_KEY){ return simpleBot(sys,usr); }
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{ method:"POST",
      headers:{"content-type":"application/json","x-api-key":API_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:MODEL,max_tokens:1200,system:sys,messages:[{role:"user",content:usr}]})});
    if(!r.ok){ let t=await r.text(); toast("Błąd API: "+r.status); console.warn(t); return simpleBot(sys,usr); }
    const j=await r.json(); return (j.content||[]).filter(b=>b&&b.type==="text").map(b=>b.text).join("").trim()||"";
  }catch(e){ console.warn(e); toast("Brak połączenia z API — bot awaryjny."); return simpleBot(sys,usr); }
}
function simpleBot(sys,usr){ // fallback: valid JSON-ish minimal
  if(sys.includes('"accept"')) return JSON.stringify({accept:rand()<0.45,say:"Zobaczymy, czy dotrzymasz słowa."});
  if(sys.includes('"talk"')) return JSON.stringify({talk:[{f:"rome",say:"Hmm."}],opponent_cards:[],supports:[]});
  return JSON.stringify({table_talk:"...",action:{type:"pass"}});
}
function parseJSON(t){ if(!t)return null; let m=t.match(/\{[\s\S]*\}/); if(!m)return null; try{return JSON.parse(m[0]);}catch(e){ try{return JSON.parse(m[0].replace(/,\s*}/g,"}").replace(/,\s*]/g,"]"));}catch(e2){return null;} } }

/* ===================== UI helpers ===================== */
function talk(fk,txt){ const log=document.getElementById("chlog"); let d=document.createElement("div"); d.className="tk";
  d.innerHTML=`<span class="who" style="color:${FACTIONS[fk].raw}">${FACTIONS[fk].short}:</span> <span class="say">${esc(txt)}</span>`; log.appendChild(d); log.parentElement.scrollTop=1e9;
  S.f[fk] && (S.f[fk].diplo=S.f[fk].diplo); }
function talkSys(txt){ const log=document.getElementById("chlog"); let d=document.createElement("div"); d.className="tk sys"; d.textContent=txt; log.appendChild(d); log.parentElement.scrollTop=1e9; }
function esc(s){ return (s+"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])); }
let toastT=null;
function toast(t){ const box=document.getElementById("toast"); let d=document.createElement("div"); d.className="toast"; d.textContent=t; box.appendChild(d);
  setTimeout(()=>{d.style.opacity=0;d.style.transition="opacity .5s";setTimeout(()=>d.remove(),500);},2600); }
function showMsg(html,after,noClose){ const v=document.getElementById("msgVeil"),m=document.getElementById("msg"); m.innerHTML=html; v.classList.add("on");
  v.onclick=noClose?null:(e=>{if(e.target===v)closeMsg();}); after&&after(m); }
function closeMsg(){ document.getElementById("msgVeil").classList.remove("on"); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ===================== ANIMACJE KART ===================== */
const FX_COL={taktyka:"#3a6ea5",intryga:"#7a3aa5",reakcja:"#c07a1a","dowódca":"#8f2d22","postać":"#b8860b",wzmocnienie:"#2f6f3a",specjalna:"#8a6d1a","władca":"#8f2d22",wydarzenie:"#8a2b22"};
function _rc(el){ if(!el)return null; const r=el.getBoundingClientRect(); if(!r.width)return null; return [r.left+r.width/2, r.top+r.height/2]; }
function provXY(p){ return _rc(document.querySelector('.prov[data-p="'+p+'"]')); }
function armyXY(id){ return _rc(document.querySelector('.army[data-id="'+id+'"]')); }
function pulseAt(x,y){ if(x==null)return; const p=document.createElement("div"); p.className="fx-pulse"; p.style.left=x+"px"; p.style.top=y+"px"; document.body.appendChild(p); setTimeout(()=>p.remove(),650); }
function hitSel(sel){ const el=document.querySelector(sel); if(!el)return; el.classList.remove("fx-hit"); void el.offsetWidth; el.classList.add("fx-hit"); setTimeout(()=>el&&el.classList.remove("fx-hit"),850); }
function throwCard(cardKey,opt){ opt=opt||{}; const cd=CARDS[cardKey]; if(!cd)return; if(!document.querySelector(".prov"))return; // nie animuj gdy brak planszy
  const W=innerWidth,H=innerHeight; const to=opt.to||[W/2,H/2]; const from=opt.from||[W/2,H*0.95];
  const el=document.createElement("div"); el.className="flycard"; el.style.borderLeftColor=FX_COL[cd.t]||"#9a8660";
  el.innerHTML=(opt.who?`<div class="fwho" style="color:${opt.color||'#3a2c18'}">${opt.who}</div>`:"")+`<div class="fn">${cd.n}</div><div class="ft">${(cd.d||"").slice(0,72)}</div>`;
  el.style.left=from[0]+"px"; el.style.top=from[1]+"px"; el.style.setProperty("--fr",(Math.random()*12-6).toFixed(1)+"deg");
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.classList.add("in"); el.style.left=to[0]+"px"; el.style.top=to[1]+"px"; });
  setTimeout(()=>pulseAt(to[0],to[1]),460);
  setTimeout(()=>{ el.classList.remove("in"); el.classList.add("out"); },1150);
  setTimeout(()=>el.remove(),1750);
}
// zagranie karty: gracz (z ręki, dół) albo AI (z panelu wrogów / boku); to = punkt docelowy [x,y] w px
function fxPlay(cardKey,fk,to){ const isP=fk===S.player; const W=innerWidth,H=innerHeight;
  throwCard(cardKey,{ who:isP?null:(FACTIONS[fk]?FACTIONS[fk].short:""), color:FACTIONS[fk]?FACTIONS[fk].raw:"",
    to: to||[W/2,H/2], from: isP?[W*0.5,H*0.96]:[W*0.93,H*0.8] }); }
function matXY(fk){ const m=[...document.querySelectorAll(".mat")].find(x=>x.querySelector("h3")&&x.querySelector("h3").textContent.includes(FACTIONS[fk].short)); return _rc(m); }
function floatGain(text,xy,color){ if(!xy)return; const el=document.createElement("div"); el.className="fx-float"; el.textContent=text; if(color)el.style.color=color; el.style.left=xy[0]+"px"; el.style.top=xy[1]+"px"; document.body.appendChild(el); setTimeout(()=>el.remove(),1450); }
// pokaż zmiany zasobów frakcji (Złoto/Chwała) jako wyskakujące „+N" przy jej macie/chipie
function floatDelta(fk,g0,gl0){ let xy=matXY(fk); if(!xy){ const chip=[...document.querySelectorAll("#enemies .echip")].find(c=>c.dataset.k===fk); xy=_rc(chip); } if(!xy)return;
  const f=S.f[fk]; if(f.gold>g0)floatGain("+"+(f.gold-g0)+" 💰",xy,"#b8860b"); if(f.glory>gl0)floatGain("+"+(f.glory-gl0)+" ✦",[xy[0]+34,xy[1]],"#8a7d3d"); }

function boot(){
  showMsg(`<h2>Europe: Up To Grabs!</h2><p style="margin-top:-6px;font-size:12px;color:#8a2b22;font-style:italic">Barbarzyńcy u Bram — humor-strategia o Wędrówce Ludów</p>
   <p style="line-height:1.45">Prototyp do testów. Wcielasz się w jedną frakcję, trzy pozostałe prowadzi <b>Claude</b> — negocjują, obiecują i zdradzają po polsku.</p>
   ${API_KEY
     ? `<p style="font-size:13px;color:#2f6f3a;margin:8px 0 2px">✓ Klucz API zapamiętany — nie musisz go wpisywać. <a href="#" id="chgkey" style="color:#8a2b22;margin-left:4px">zmień / wyczyść</a></p>
        <input id="key" type="password" value="${API_KEY}" style="display:none">`
     : `<p style="font-size:12px;color:#6b5030">Klucz API Anthropic (żeby frakcje myślały; bez klucza działa tryb awaryjnego bota). Zapisze się w tej przeglądarce, wpiszesz go tylko raz.</p>
        <input id="key" type="password" placeholder="sk-ant-... (wklej raz)" value="">`}
   <select id="model"><option value="claude-sonnet-5">Claude Sonnet 5 (szybki, tani — polecany)</option><option value="claude-opus-4-8">Claude Opus 4.8 (najsprytniejszy, wolniejszy)</option><option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (najszybszy)</option></select>
   <p style="margin-top:10px">Wybierz swoją frakcję:</p>
   <div class="opts">${Object.keys(FACTIONS).map(k=>`<div class="opt" data-k="${k}"><b style="color:${FACTIONS[k].raw}">${FACTIONS[k].name}</b><br><span style="font-size:11px;color:#5a4a35">${FACTIONS[k].mech}</span></div>`).join("")}</div>`,
   el=>{ el.querySelector("#model").value=MODEL;
     const chg=el.querySelector("#chgkey"); if(chg)chg.onclick=(e)=>{ e.preventDefault(); const inp=el.querySelector("#key"); inp.style.display="block"; inp.value=""; inp.placeholder="sk-ant-... (nowy klucz, albo zostaw puste by wyczyścić)"; inp.focus(); API_KEY=""; localStorage.removeItem("barb_key"); chg.parentElement.innerHTML="Wpisz nowy klucz (albo zostaw puste — wtedy tryb bota):"; };
     el.querySelectorAll(".opt[data-k]").forEach(o=>o.onclick=()=>{
       const typed=el.querySelector("#key").value.trim(); API_KEY=typed||API_KEY; MODEL=el.querySelector("#model").value;
       if(API_KEY)localStorage.setItem("barb_key",API_KEY); else localStorage.removeItem("barb_key"); localStorage.setItem("barb_model",MODEL);
       closeMsg(); startGame(o.dataset.k); }); }, true);
}
function startGame(player){
  RNG=987654321;
  newState(player);
  talkSys(`Grasz jako ${FACTIONS[player].name}. Faza układania stołu — rozłóż prowincje i talię, potem ROZPOCZNIJ GRĘ.`);
  render();
  toast("🗺️ Rozłóż prowincje jak chcesz (przeciągaj), potem kliknij ROZPOCZNIJ GRĘ.");
  makeDeckDraggable();
  window.addEventListener("resize",render);
}
function makeDeckDraggable(){ const dk=document.getElementById("deck"); if(!dk||dk._dragSet)return; dk._dragSet=true;
  dk.addEventListener("mousedown",e=>{ if(!S||S.phase!=="setup")return; e.preventDefault();
    const sx=e.clientX,sy=e.clientY,ox=S.deckPos.x,oy=S.deckPos.y; dk.style.zIndex=50;
    const mm=ev=>{ S.deckPos.x=Math.max(0,Math.min(94,ox+(ev.clientX-sx)/T.clientWidth*100)); S.deckPos.y=Math.max(0,Math.min(88,oy+(ev.clientY-sy)/T.clientHeight*100)); dk.style.left=S.deckPos.x+"%"; dk.style.top=S.deckPos.y+"%"; };
    const mu=()=>{ document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); dk.style.zIndex=""; };
    document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu); }); }
boot();
</script>
